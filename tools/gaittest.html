<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#2a3a4f;overflow:hidden}</style>
<script src="../vendor/three.min.js"></script>
<script src="../vendor/GLTFLoader.js"></script>
</head><body><script>
const W=520,H=640;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x2a3a4f);
const cam=new THREE.PerspectiveCamera(40,W/H,0.01,9000);
const rend=new THREE.WebGLRenderer({antialias:true}); rend.setSize(W,H); rend.outputEncoding=THREE.sRGBEncoding; document.body.appendChild(rend.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.95)); const d=new THREE.DirectionalLight(0xffffff,1.2); d.position.set(3,6,4); scene.add(d);
scene.add(new THREE.GridHelper(8,16,0x556,0x445));
const _axX=new THREE.Vector3(1,0,0), _tq=new THREE.Quaternion();
let model,B={},u={phase:0,gait:1},jerseyMat=null;
function findBone(root,sub){let f=null;root.traverse(o=>{if(!f&&o.isBone&&o.name.indexOf(sub)>=0)f=o;});return f;}
function setBone(b,ax,ang){if(!b||!b.userData.bind)return;b.quaternion.copy(b.userData.bind);_tq.setFromAxisAngle(ax,ang);b.quaternion.multiply(_tq);}
function applyPose(u,st,spy){const B=u.B;if(!B)return;const L=(k,a)=>setBone(B[k],_axX,a);
  if(st==='run'){u.phase+=Math.min(0.55,0.08+spy*0.055);const A=Math.min(0.95,0.3+spy*0.075),sn=Math.sin(u.phase),sn2=Math.sin(u.phase+Math.PI);L('LeftUpLeg',sn*A);L('RightUpLeg',sn2*A);L('LeftLeg',Math.max(0,-sn)*A*1.5);L('RightLeg',Math.max(0,-sn2)*A*1.5);L('LeftArm',-sn*A*0.8);L('RightArm',-sn2*A*0.8);L('LeftForeArm',-(0.7+Math.max(0,sn)*0.4));L('RightForeArm',-(0.7+Math.max(0,sn2)*0.4));L('Spine2',Math.min(0.32,0.12+spy*0.028));}
  else if(st==='set'){L('LeftUpLeg',0.42);L('RightUpLeg',0.42);L('LeftLeg',0.62);L('RightLeg',0.62);L('Spine2',0.5);L('LeftArm',-0.35);L('RightArm',-0.35);L('LeftForeArm',-0.7);L('RightForeArm',-0.7);}
  else if(st==='throw'){L('RightArm',-1.7);L('RightForeArm',-0.4);L('LeftArm',-0.5);L('LeftForeArm',-0.6);L('Spine2',0.2);L('LeftUpLeg',-0.15);L('RightUpLeg',0.2);}
  else if(st==='kick'){L('RightUpLeg',1.4);L('RightLeg',0.1);L('LeftUpLeg',-0.15);L('LeftLeg',0.1);L('Spine2',-0.1);L('LeftArm',-0.3);L('RightArm',0.3);}
  else if(st==='tackle'){L('Spine2',0.6);L('LeftArm',-1.3);L('RightArm',-1.3);L('LeftForeArm',-0.3);L('RightForeArm',-0.3);L('LeftUpLeg',0.45);L('RightUpLeg',-0.3);L('RightLeg',0.5);}
  else if(st==='celebrate'){const up=-2.5;L('LeftArm',up);L('RightArm',up);L('LeftForeArm',-0.3);L('RightForeArm',-0.3);L('Spine2',-0.15);}
  else{L('Spine2',0.0);} rend.render(scene,cam);}
window.__ready=false;
new THREE.GLTFLoader().load('../assets/fbplayer_opt.glb',(g)=>{
  model=g.scene; scene.add(model);
  const box=new THREE.Box3().setFromObject(model);const sz=new THREE.Vector3();box.getSize(sz);const s=2/sz.y;model.scale.setScalar(s);
  const b2=new THREE.Box3().setFromObject(model);model.position.y=-b2.min.y;
  ['Hips','Spine2','LeftUpLeg','LeftLeg','RightUpLeg','RightLeg','LeftArm','LeftForeArm','RightArm','RightForeArm'].forEach(k=>{const b=findBone(model,k);if(b){b.userData.bind=b.quaternion.clone();B[k]=b;}});
  model.traverse(o=>{if(o.isMesh&&o.material&&(o.material.name||'')==='shirt_0'){o.material=o.material.clone();jerseyMat=o.material;}});
  u.B=B; cam.position.set(2.2,1.2,3.0);cam.lookAt(0,1,0);
  window.__pose=(st,spy)=>{applyPose(u,st,spy||7);};
  window.__tint=(hex)=>{if(jerseyMat){jerseyMat.color.setHex(hex);rend.render(scene,cam);}};
  window.__spin=(deg)=>{model.rotation.y=deg*Math.PI/180;rend.render(scene,cam);};
  window.__ready=true;rend.render(scene,cam);
},undefined,e=>{window.__err=String(e&&e.message||e);});
function loop(){rend.render(scene,cam);requestAnimationFrame(loop);}loop();
</script></body></html>
